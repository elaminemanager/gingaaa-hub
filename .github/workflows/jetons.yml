name: Jetons d'accès

# Chaque lundi : prolonge le jeton Instagram avant son expiration (60 jours).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prolonger le jeton Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/refresh-instagram.mjs

      - name: Enregistrer le nouveau jeton
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .rotated/IG_ACCESS_TOKEN ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::Instagram a fourni un nouveau jeton mais le secret GH_PAT est absent : il ne peut pas être enregistré."
              exit 1
            fi
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat .rotated/IG_ACCESS_TOKEN)"
          fi
